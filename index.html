<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi GPS avec Firebase</title>
     <!-- Ajouter le lien vers la feuille de style de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <!-- Ajouter le lien vers le script JS de Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="static/style.css"> <!-- Changer le lien pour charger le CSS à partir de "static" -->
</head>
<body>
    <h1>Suivi GPS en temps réel</h1>
    <p>Vitesse: <span id="speed">0 km/h</span></p>
    <div id="map" style="height: 400px; width: 100%;"></div>
    <div>
        <p>Latitude: <span id="latitude">0</span></p>
        <p>Longitude: <span id="longitude">0</span></p>
        
    </div>

    <!-- Charger le script JS à partir de "static" -->
    <script type="module" src="static/script.js"></script> 
</body>
</html>
